<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Lead - CRM</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; }
        .form-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #004494; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registro de Lead</h2>
    <form id="leadForm">
        <label for="email">Endereço de E-mail:</label>
        <input type="email" id="email" required placeholder="contato@exemplo.com.br">

        <label for="phone">Número de Telefone:</label>
        <input type="tel" id="phone" required placeholder="+5511999999999">

        <button type="submit">Enviar Dados</button>
    </form>
    <div id="status"></div>
</div>

<script>
    document.getElementById('leadForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // Impede o recarregamento padrão da página

        const emailData = document.getElementById('email').value;
        const phoneData = document.getElementById('phone').value;
        const statusDiv = document.getElementById('status');

        statusDiv.style.color = "blue";
        statusDiv.innerText = "Enviando dados para o servidor...";

        try {
            // Disparo da requisição HTTP POST para o Back-end
            const response = await fetch('http://localhost:3000/api/event', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: emailData, phone: phoneData })
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.style.color = "green";
                statusDiv.innerText = "Lead cadastrado com sucesso!";
                document.getElementById('leadForm').reset();
            } else {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Erro: " + result.mensagem;
            }
        } catch (error) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Falha na conexão com o servidor. Verifique se o app.js está rodando.";
        }
    });
</script>

</body>
</html>
